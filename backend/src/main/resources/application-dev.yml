# =============================================
# 本地开发环境配置 (不需要 Docker)
# =============================================

spring:
  flyway:
    enabled: false

  # H2 嵌入式数据库 (替代 MySQL，无需安装)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/codemate-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 10

  # 启动时执行建表脚本（种子数据由 CurriculumSeeder 注入）
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-h2.sql

  # H2 控制台 (开发时可通过浏览器访问: http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # 禁用 Redis (本地开发不需要)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# MyBatis-Plus 开发环境
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token 开发环境 (使用默认内存存储，无需 Redis)
sa-token:
  alone-redis: false

# AI 大模型配置
codemate:
  ai:
    api-key: ${AI_API_KEY:}
    api-url: https://api.deepseek.com/v1
    model: deepseek-v4-flash

# 日志级别
logging:
  level:
    com.xxxtxm: debug
