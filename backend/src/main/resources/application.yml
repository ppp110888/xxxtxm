server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: codemate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # 数据源 (默认连接 Docker 中的 MySQL，dev 模式自动切换 H2)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/codemate?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:codemate-local-only}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ (阶段二启用)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:codemate}
    password: ${RABBITMQ_PASSWORD:codemate-local-only}
    # 判题队列消费者（dev 模式下 auto-startup=false 避免报错）
    listener:
      simple:
        auto-startup: true

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 604800           # 7 天 (秒)
  active-timeout: 1800      # 30 分钟无操作冻结
  is-concurrent: true       # 允许多端登录
  is-share: true
  token-style: tik          # token 风格
  is-log: false

# 判题沙箱配置 (阶段二启用)
codemate:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  judge:
    go-judge-url: ${JUDGE_URL:http://localhost:5050}
    callback-host: ${CALLBACK_HOST:http://localhost:8080}
  ai:
    api-key: ${AI_API_KEY:}
    api-url: https://api.deepseek.com/v1
    model: deepseek-v4-flash

# SpringDoc OpenAPI (Knife4j 增强 UI)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  group-configs:
    - group: public
      display-name: 公开接口
      paths-to-match: /api/v1/auth/**
    - group: admin
      display-name: 管理端
      paths-to-match: /api/v1/admin/**
    - group: student
      display-name: 学生端
      paths-to-match: /api/v1/student/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
